# Page manifest consumed by ../build.py.
# Runtime files are copied to dist/gamejam/. Source-only helpers stay behind.

name = "gamejam"
title = "ELLIA PAGES — GAMEJAM 2026"
entry = "index.html"

# The root index is a directory page; mirror-2610 holds the mirror homepage
# and the diagnostic lab. Shared effects and three live outside page folders.
include = [
  "index.html",
  "mirror-2610/**",
  "js/effects/**",
  "libs/three/**",
]

# libs/three/src is the esbuild input, not a browser asset.
exclude = [
  "libs/three/src/**",
  "js/effects/**/*.map",
  "libs/three/**/*.map",
  "js/**/__pycache__/**",
  "libs/**/__pycache__/**",
]
